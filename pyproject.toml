[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "donetick-mcp-server"
version = "0.3.13"
description = "MCP server for Donetick chores management with JWT authentication, Full API support, and 36 MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jason", email = "jason1365@users.noreply.github.com"},
    {name = "Konstantin Späth"},
]
keywords = ["mcp", "donetick", "chores", "api", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.1.0",
    # IANA timezone data for zoneinfo (not bundled on Windows / slim images)
    "tzdata>=2025.1",
]

[project.urls]
Homepage = "https://github.com/Duell10111/donetick-mcp-server"
Documentation = "https://github.com/Duell10111/donetick-mcp-server#readme"
Repository = "https://github.com/Duell10111/donetick-mcp-server"
Issues = "https://github.com/Duell10111/donetick-mcp-server/issues"
Changelog = "https://github.com/Duell10111/donetick-mcp-server/blob/main/CHANGELOG.md"
Upstream = "https://github.com/jason1365/donetick-mcp-server"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.15",
    "pytest-httpx>=0.36",
    "pytest-cov>=7.0",
    "ruff>=0.16",
]

[project.scripts]
donetick-mcp-server = "donetick_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "live_api: tests that interact with a real Donetick instance (run with: pytest -m live_api)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by formatter)
